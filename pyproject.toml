[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grase-glider-compare"
version = "1.2.0"
description = "Compare GrASE, NoGrASE and reference model outputs with glider observations"
authors = [{name = "Xiao Ge", email = "gexiao@tamu.edu"}]
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "scipy>=1.10", "pandas>=2", "xarray>=2023.1", "netCDF4>=1.6", "dask[array]>=2023.1", "matplotlib>=3.7", "cmocean>=3", "gsw>=3.6", "Pillow>=9"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
grase-glider-compare = "grase_glider_compare.cli:main"

[tool.setuptools.packages.find]
include = ["grase_glider_compare*"]
